name: Docker Image Test

on:
  pull_request:
    branches: ["main"]
    paths:
      - "docker/**"
      - "src/**"
      - ".github/workflows/docker-image-test.yml"

jobs:
  build-and-test:
    name: Build & Run Docker Image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: statuspage-exporter:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container with real-world services.json
        run: |
          docker run -d \
            --name statuspage-exporter \
            -p 9001:9001 \
            -e CHECK_INTERVAL_MINUTES=30 \
            -v "${{ github.workspace }}/src/services.json:/app/statuspage-exporter/services.json:ro" \
            statuspage-exporter:test

      - name: Wait for real service data in metrics
        run: |
          # The initial run has to make live HTTP calls to every service in
          # src/services.json before gauges are populated, so poll on the
          # actual data landing rather than just the endpoint responding.
          for i in $(seq 1 90); do
            if curl -sf http://localhost:9001/metrics -o /tmp/metrics.txt \
                && grep -q 'statuspage_service_status{service_name="Conga"}' /tmp/metrics.txt \
                && grep -q 'statuspage_service_status{service_name="DocuSign"}' /tmp/metrics.txt \
                && grep -q 'statuspage_probe_check{service_name="Conga"}' /tmp/metrics.txt; then
              echo "Real service data present after ${i}s"
              break
            fi
            if [ "$i" -eq 90 ]; then
              echo "Service data did not appear in time"
              docker logs statuspage-exporter
              exit 1
            fi
            sleep 1
          done

          echo "--- metrics sample ---"
          grep 'statuspage_service_status' /tmp/metrics.txt

      - name: Check container is healthy and logs are clean
        run: |
          docker logs statuspage-exporter
          docker logs statuspage-exporter 2>&1 | grep -qi 'Traceback' && exit 1 || true

      - name: Stop and remove container
        if: always()
        run: docker rm -f statuspage-exporter || true
